# One site, as one config. Copy this folder (python build.py --new
# sites/<name>), then change every value below to the person's own.
# TEMPLATE.md at the repository root tells the whole of it.
#
# Values may hold HTML (a <br>, an &mdash;). Order matters wherever a list
# or a table of tables is shown on the page: it is the order on the page.

[site]
# What this site is:
#   "blog"              a blog with a mailing list
#   "signup"            one short signup page, nothing else (uses [signup] below)
#   "blog-with-logins"  a blog with a mailing list and a Sign in link (uses [logins] below)
kind = "blog"
name = "Site Name"                       # the brand, top left, and the page titles
author = "Author Name"                   # the person; leave out when it equals name
url = "https://example.com/"             # the published address, ending in /
tagline = "One sentence on what this site is."
year = "2026"
lang = "en"
body_class = "theme-ink"                 # a theme block in assets/themes.css
brand_mark = "(-:"                       # beside the name, top left
accent_project = "Main"                  # whose colour the mailing-list eyebrows wear
default_glyph = "☀"                      # a post with no glyph of its own
author_initials = "AN"
author_bio = "A sentence or two about the author, under every post."
signup_thanks = "Welcome. Your first email is on its way."   # shown after joining
# extra_css = ["assets/site.css"]        # a file placed in site-assets/site.css

[mailing]
# The provider's form address. Empty means the forms complete on the page
# and send nowhere, for a site not yet live. mailing/README.md says how.
endpoint = ""
reassure = "We'll never share your info with anyone."
interests_summary = "Choose what you receive"

[header]
nav = [["Shop", "shop.html"]]            # extra links after the categories
join_button = "Join the List"

# The main groupings, side by side in the header, each gathering
# categories below. One is enough.
[roots]
"Writing" = ["First Category"]

[categories."First Category"]
slug = "first-category"
blurb = "What this category holds."
[categories."First Category".subs."First Subcategory"]
children = []
blurb = "What this subcategory holds."

# A child is a page one level deeper than a subcategory:
#   [categories."First Category".subs."First Subcategory"]
#   children = ["A Child"]
#   [child_info."A Child"]
#   blurb = "Its words."
#   note = "shown beside its checkbox in the signup form"

# ---- Projects: each a coloured stream in the woven rope across the dark
# bands, with its own symbols. A post names its project in front-matter.
[weave]
thread = []                              # colours for a strand whose hue is "url(#dta-thread)"

[projects.Main]
color = "#f5c542"
hues = ["#f5c542", "#4ca373"]            # the stream's two strands
symbols = ["(-:", ":-)", "(:", ":)", "✦", "◯", "∞", "☀"]

# ---- The home page
[home]
hero_title = "The Writing of<br>Author Name"
hero_sub = "One or two sentences. New posts go out by email when they are written."
hero_button = "Join the Mailing List"
hero_art = "(-:"
ornament = "(:☸:)"
trust_heading = "What Is Here"
# {posts} is the number of posts, {symbols} the number of weave symbols
stats = [["✎", "{posts}", "Pieces of Writing"], ["(-:", "1", "Author"]]
articles_heading = "Articles"
empty_text = "The first posts are being written."   # shown while a grid has no posts

# A feature band. Leave the whole table out for none. Its button opens
# href, or the newest post of project when href is empty.
[home.feature]
eyebrow = "The freebie"
heading = "The Free Thing, for joining."
text = "Join the mailing list and it arrives with the welcome email, yours to keep."
button = "Send It to Me"
href = "shop.html#the-free-thing"
project = "Main"

# A dark band with the woven rope and a second invitation. Leave it out for none.
[home.midband]
eyebrow = "The mailing list"
heading = "New posts arrive by email."
text = "Join once and each new piece is sent when it is published."
button = "Join the Mailing List"
art = "(-:"

[popup]
heading = "Join the mailing list."
button = "Join"
art = "(-:"

[footer]
cta_eyebrow = "The mailing list"
cta_heading = "New posts arrive by email."
cta_text = "Join once and each new piece is sent when it is published."
cta_button = "Join the Mailing List"
cta_art = "(-:"
projects_heading = "Projects"
site_heading = "Site"
links = [["Home", "index.html"], ["Shop", "shop.html"]]
image = "assets/buddha_eyes.webp"        # the Buddha eyes; empty for no image
image_alt = "Buddha eyes"
legal = "May this writing benefit all beings."
# scripture = ""                         # a long text set small at the foot, e.g. a sutra
# scripture_lang = "zh"
# scripture_label = "What it is, for screen readers"

# ---- For kind = "signup": the one page
[signup]
kicker = "The mailing list"
heading = "Join the list."
text = "One or two sentences on what arrives, and how often."
form_heading = ""                        # a line above the form; empty for none
button = "Join"
tag = "signup"

# ---- For kind = "blog-with-logins": where sign-in lives. A static site
# cannot hold accounts itself, so this links to the service that does.
# HOW-TO.md names the ways to have one.
[logins]
url = ""                                 # e.g. https://accounts.example.com/login
label = "Sign in"
library_url = ""                         # what a signed-in person has unlocked
library_label = "Library"

# ---- The shop. Leave out every [[products]] for no shop page.
[shop]
title = "Shop"
blurb = "What is offered here."
glyph_project = "Main"
signup_tag = "shop-updates"
signup_heading = "Payment opens here when the shop goes live"
signup_button = "Send Me the Opening"
block_heading = "The shop"               # the block a post places with [[shop]]
block_text = "Everything offered is gathered in the shop."
block_button = "Visit the Shop"

[[products]]
key = "the-free-thing"
glyph = ":)"
price = "Free"
title = "The Free Thing"
text = "Arrives with the welcome email when you join the mailing list, and is yours to keep."

# ---- The freebie: the free thing a person receives for joining. It is a
# product above (price "Free"), its file lives in freebie/, and the
# welcome email delivers it. The engine never publishes the file.
[freebie]
product = "the-free-thing"
file = "freebie/the-free-thing.md"

# ---- Ghost, when posts are carried over with tools/ghost_one.py
[ghost]
author_name = "Author Name"
author_slug = "author"
author_email = ""
canonical_base = "https://example.com/"

[sections]
gurus = ""                               # a section built from another folder; empty for none
sitemap_folders = []                     # HTML posts published under site/<folder>/
