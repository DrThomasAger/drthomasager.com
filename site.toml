# The DrThomasAger site, as one config.
#
# Everything that makes this site his and not someone else's lives here:
# names, address, tagline, mailing list, categories, projects and their
# colours, the shop, the home page words, the footer. build.py is the
# engine and holds none of it. A new site is a copy of template/ with its
# own site.toml; TEMPLATE.md says how.
#
# Values may hold HTML (a <br>, an &mdash;). Order matters wherever a list
# or a table of tables is shown on the page: it is the order on the page.

[site]
name = "Dr Thomas Ager"
url = "https://drthomasager.github.io/drthomasager.com/"
tagline = "Ethical, Bodhisattva and Shambhala AI brought into local communities with local LLMs, for business owners and people building such projects."
year = "2026"
lang = "en"
body_class = "theme-ink"           # a theme block in assets/themes.css
brand_mark = "(-:"                 # beside the name, top left
accent_project = "Smile"           # whose colour the mailing-list eyebrows and shop glyphs wear
default_glyph = "☀"                # a post with no glyph of its own
author_initials = "TA"
author_bio = "Dr Thomas Ager holds a Ph.D in Artificial Intelligence and writes on prompt engineering and spirituality. His current research is the Smile Prompt Language."
# signup_thanks = ""               # the line shown after joining; unset keeps the engine's own
# extra_css = []                   # more stylesheets after themes.css, e.g. ["assets/site.css"]

[mailing]
# The one line that receives the provider's form address. Empty means the
# forms complete on the page and send nowhere, for a site not yet live.
endpoint = "https://buttondown.com/api/emails/embed-subscribe/drthomasager"
reassure = "We'll never share your info with anyone."
interests_summary = "Choose which projects you receive"

[header]
nav = [["Gurus", "gurus/"], ["Shop", "shop.html"]]
join_button = "Join the List"

# The two main categories, side by side in the header, each gathering the
# categories below that belong to it.
[roots]
"Community AI" = ["AI Agents", "Prompt Engineering"]
"Bodhisattva Practice" = ["Buddhism"]

[categories."AI Agents"]
slug = "ai-agents"
blurb = "What an AI agent is, where its boundary sits, and how to build with that knowledge."
[categories."AI Agents".subs."Agent Definitions"]
children = []
blurb = "What an agent is, what agency is, and what agentiality is."
[categories."AI Agents".subs."Agent Engineering"]
children = []
blurb = "Harness, scaffold, memory, and subagents, read through the definition."

[categories."Prompt Engineering"]
slug = "prompt-engineering"
blurb = "The craft of speaking with language models — languages, prompts, and teachings."
[categories."Prompt Engineering".subs."Prompt Language Development"]
children = ["Smile"]
blurb = "Building languages for speaking with AI."
[categories."Prompt Engineering".subs."Free Prompts"]
children = []
blurb = "Prompts to take, use, and make your own."
[categories."Prompt Engineering".subs."Tutorial"]
children = []
blurb = "Step-by-step introductions, from the beginning."

[categories."Buddhism"]
slug = "buddhism"
blurb = "The dharma as lived, translated, and walked into."
[categories."Buddhism".subs."Sacred Geometry"]
children = []
blurb = "The forms beneath the forms — drawn, built, and walked into."
[categories."Buddhism".subs."Translations"]
children = []
blurb = "Ancient texts carried into English."
[categories."Buddhism".subs."Monastic Life"]
children = []
blurb = "Ordination, robes, and the monastery day."
[categories."Buddhism".subs."Commentaries"]
children = []
blurb = "Commentaries on contemplation and the nature of mind."

# Child pages (the deepest level) carry their own words. The note shows
# beside the child's checkbox in the signup form's interests.
[child_info.Smile]
blurb = "The Smile Prompt Language and Smile Chat, written up as they grow."
note = "the Smile Prompt Language and Smile Chat"

# ---- The projects: each a stream in the woven rope across the dark
# bands, with its own colour and symbols. The colour also marks the
# project's posts, chips and card glyphs everywhere. The arrangement is
# the Five Buddha Families of the Vajradhatu mandala; INHERITANCE.md
# tells the whole of it. A project not named here wears white.
[weave]
thread = ["#6f9ce4", "#f5c542", "#ff7f8d", "#62d194"]   # the centre's thin strand, sunwise

[projects.Buddhism]
color = "#ffffff"
hues = ["#ffffff", "url(#dta-thread)"]
symbols = ["☸", "◯", "無", "空", "禪", "心", "佛", "法", "慈", "悲", "定", "慧", "ॐ", "戒"]

[projects.Smile]
color = "#f5c542"
hues = ["#f5c542", "#4ca373"]
symbols = ["(-:", ":-)", "(:", ":)", ";-)", ":o)", "{ }", "[= =]", "‹ ›", "(^:", "=)", "(-;", ":-P", "8-)"]

[projects."Sacred Travel"]
color = "#ff7f8d"
hues = ["#ff7f8d", "#577ab2"]
symbols = ["☥", "𓂀", "𓆣", "𓉴", "𓋹", "𓅓", "✈", "✦", "៙", "៚", "𓊽", "𓁹"]

[projects."Machine Learning"]
color = "#6f9ce4"
hues = ["#6f9ce4", "#c7636e"]
symbols = ["∇", "Σ", "λ", "⊗", "∂", "θ", "ε", "σ", "π", "≈", "∞", "⊕", "01", "110"]

# ---- The home page
[home]
hero_title = "The Writing of<br>Dr Thomas Ager"
hero_sub = "Ethical, Bodhisattva and Shambhala AI brought into local communities with local LLMs, for business owners and people building such projects. New posts go out by email when they are written."
hero_button = "Join the Mailing List"
hero_art = "(-:"
ornament = "(:☸:)"
trust_heading = "What Is Here"
# {posts} is the number of posts, {symbols} the number of weave symbols
stats = [["☸", "5", "Writing Projects"], ["✎", "{posts}", "Pieces of Writing"], ["✳", "{symbols}", "Symbols in the Weave"], ["(-:", "1", "Author"]]
articles_heading = "Articles"

[home.feature]
eyebrow = "The Smile Prompt Language"
heading = "A prompt language written in emoticons."
text = "Smile is a prompt language for speaking with language models. It is developed here, alongside Smile Chat, the local conversation rig it runs in. Posts document the language as it develops."
button = "Read About Smile"
project = "Smile"            # the button opens the newest post of this project

[home.midband]
eyebrow = "The Smile mailing list"
heading = "Smile has its own sub-mailing-list."
text = "It runs on this same mailing engine. Choose Smile when you join and Smile posts arrive on their own."
button = "Join the Smile List"
art = "(-:"

# ---- The popup, after 33 seconds, 55% scroll or exit intent
[popup]
heading = "Join the mailing list."
button = "Join"
art = "(-:"

