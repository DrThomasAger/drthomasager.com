# ---- The shop, and the block a post places with [[shop]]
[shop]
title = "Shop"
blurb = "The prompt packs and the free guide. Every pack updates in perpetuity."
glyph_project = "Smile"
signup_tag = "prompt-pack-updates"
signup_heading = "Payment opens here when the shop goes live"
signup_button = "Send Me the Opening"
block_heading = "The prompt packs"
block_text = "The prompts these agents are built with are gathered in the shop."
block_button = "Visit the Shop"

[[products]]
key = "professional-prompt-pack"
glyph = "[= =]"
price = "$33"
title = "The Professional Tier Prompt Pack"
text = "The complete professional-tier prompt pack, with prompts for research, writing, and agentic work, refined in daily use and growing with every update."

[[products]]
key = "smile-prompt-pack"
glyph = "(-:"
price = "$22"
title = "The Smile Prompt Pack"
text = "Complete prompts written in the Smile Prompt Language, from first sections to full harnesses, growing with the language."

[[products]]
key = "both-packs-lifetime"
glyph = "(:"
price = "$22.28"
title = "Both Packs, Lifetime"
text = "Both prompt packs together as one lifetime membership."

[[products]]
key = "smile-guide"
glyph = ":)"
price = "Free"
title = "The Free Guide for Using Smile"
text = "Arrives with the welcome email when you join the mailing list, and is yours to keep."

# ---- The freebie: the free thing a person receives for joining. It is a
# product above (price "Free") and the welcome email delivers it. The
# engine never publishes the file, so it stays a gift for joining.
[freebie]
product = "smile-guide"
file = ""        # his guide lives on the PC at platform\accounts\library\smile-guide.md

# ---- Ghost, when posts are carried over with tools/ghost_one.py
[ghost]
author_name = "Dr. Thomas Ager"
author_slug = "thomas"
author_email = "hanjoyoutaku@gmail.com"
canonical_base = "https://drthomasager.com/"

# ---- Sections built from elsewhere in this repository
[sections]
gurus = "hanjopurebuddha.com"     # built into site/gurus/; leave empty for none
# HTML posts published outside posts/, one folder each under site/, listed in the sitemap
sitemap_folders = ["history-of-smile", "cybernetic-buddhism-smile-portal"]
