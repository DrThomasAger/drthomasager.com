name: Harvest the U.G. Krishnamurti media

# Runs fetch.py for every recording, scan, photograph, video and text the
# archive lists, on GitHub's network, in parallel by kind. U.G. released his
# words to everyone, so every file is kept: each is uploaded as an asset of
# the release media-<kind> the moment it comes down. What comes back into
# git: holdings.json (each file's bytes, seconds, sha256 and asset address),
# the fetch log, the transcripts of the recordings, and the quotation checks
# against every text that came down, joined into git by gather.yml when
# the pass ends. Run it again to continue.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Kinds to fetch, comma separated (empty: all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include:
          - { kind: archive_org, shard: "0/12", tag: media-archive_org-s0 }
          - { kind: archive_org, shard: "1/12", tag: media-archive_org-s1 }
          - { kind: archive_org, shard: "2/12", tag: media-archive_org-s2 }
          - { kind: archive_org, shard: "3/12", tag: media-archive_org-s3 }
          - { kind: archive_org, shard: "4/12", tag: media-archive_org-s4 }
          - { kind: archive_org, shard: "5/12", tag: media-archive_org-s5 }
          - { kind: archive_org, shard: "6/12", tag: media-archive_org-s6 }
          - { kind: archive_org, shard: "7/12", tag: media-archive_org-s7 }
          - { kind: archive_org, shard: "8/12", tag: media-archive_org-s8 }
          - { kind: archive_org, shard: "9/12", tag: media-archive_org-s9 }
          - { kind: archive_org, shard: "10/12", tag: media-archive_org-s10 }
          - { kind: archive_org, shard: "11/12", tag: media-archive_org-s11 }
          - { kind: youtube, shard: "", tag: media-youtube }
          - { kind: soundcloud, shard: "", tag: media-soundcloud }
          - { kind: other_pages, shard: "", tag: media-other_pages }
          - { kind: pdf, shard: "", tag: media-pdf }
          - { kind: well, shard: "", tag: media-well }
          - { kind: wikisource, shard: "", tag: media-wikisource }
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: hanjopurebuddha.com/teachers/ug-krishnamurti
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # the newest holdings, so a queued pass continues the one before it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q internetarchive yt-dlp requests pypdf
      - name: The release that holds this kind
        run: gh release view "${{ matrix.tag }}" >/dev/null 2>&1 || gh release create "${{ matrix.tag }}" --title "U.G. Krishnamurti media, ${{ matrix.tag }}" --notes "Fetched by the harvest workflow from the addresses in hanjopurebuddha.com/teachers/ug-krishnamurti/download-manifest.json. holdings.json maps every asset to its archive item." || true
      - name: Fetch, upload each file as it arrives (stops itself before the job limit)
        if: inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0},', matrix.kind))
        run: timeout 320m python fetch.py --only "${{ matrix.kind }}" --shard "${{ matrix.shard }}" --release "${{ matrix.tag }}" --skip-held --give-up-after 15 || true
      - run: python extract-text.py || true
      - run: python find-quotes.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.tag }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            hanjopurebuddha.com/teachers/ug-krishnamurti/holdings.json
            hanjopurebuddha.com/teachers/ug-krishnamurti/local-verification.json
            hanjopurebuddha.com/teachers/ug-krishnamurti/transcripts/
            hanjopurebuddha.com/teachers/ug-krishnamurti/downloads/fetch-log.jsonl
