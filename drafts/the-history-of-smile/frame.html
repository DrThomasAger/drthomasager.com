<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}iframe{border:0;display:block}</style></head>
<body><iframe id="f"></iframe>
<pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search), f = document.getElementById('f')
f.src = q.get("src") || "index.html"; f.width = q.get('w') || 390; f.height = q.get('h') || 5200
f.addEventListener('load', () => setTimeout(() => {
  const d = f.contentDocument, w = d.defaultView
  if (q.get('at')) { const el = d.getElementById(q.get('at')); if (q.get('open')) el.open = true; w.scrollTo({top: el.getBoundingClientRect().top + w.scrollY - 20, behavior: "instant"}) }
  const wide = [...d.querySelectorAll('body *')].filter(e => e.getBoundingClientRect().right > w.innerWidth + 1).slice(0, 8).map(e => e.tagName + '.' + e.className)
  document.getElementById('out').textContent = JSON.stringify({scrollWidth: d.documentElement.scrollWidth, innerWidth: w.innerWidth, svgs: d.querySelectorAll('svg').length, circles: d.querySelectorAll('circle').length, wide})
}, 3000))
</script></body></html>
